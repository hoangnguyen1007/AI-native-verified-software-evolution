services:
  evo-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: evo-workbench-online:latest
    container_name: evo-workbench-online
    restart: unless-stopped
    ports:
      - "${EVO_PORT:-8080}:8080"
    environment:
      EVO_ONLINE_MODE: "true"
      EVO_BIND_HOST: "0.0.0.0"
      EVO_PORT: "8080"
      EVO_STATE_DIR: "/data/evo-store"
      EVO_M2_REPOSITORY: "/data/evo-store/m2-cache"
      EVO_TRUST_PROXY_HEADERS: "${EVO_TRUST_PROXY_HEADERS:-true}"
      EVO_PUBLIC_BASE_URL: "${EVO_PUBLIC_BASE_URL:-}"
      EVO_MULTI_USER: "${EVO_MULTI_USER:-false}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      EVO_GITHUB_TOKEN: "${EVO_GITHUB_TOKEN:-}"
      EVO_LLM_PROVIDER: "${EVO_LLM_PROVIDER:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      JAVA_OPTS: "${JAVA_OPTS:--Xms512m -Xmx4g -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1}"
    volumes:
      - evo_online_state:/data/evo-store

volumes:
  evo_online_state:
