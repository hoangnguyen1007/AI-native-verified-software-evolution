      description: Register an absolute local directory or HTTPS repository allowed by the endpoint policy. Authentication and SSH require explicit operator configuration. No target lifecycle runs. Acquisition captures the pinned full tree into CAS in a separately submitted cancellable job. Repeat inputs reuse the selection; inventory completion is separate from the bounded Java semantic view.
