                groupBy: {type: string, enum: [PACKAGE, COMMUNITY]}
                seed: {type: string, minLength: 1, maxLength: 8192}
                depth: {type: integer, minimum: 1, maximum: 19, default: 1}
                report: {$ref: '#/components/schemas/Digest'}
