    get:
      operationId: analysisJobEvents
      description: Dedicated virtual-thread Server-Sent Events (text/event-stream) stream emitting snapshot, stage_started, progress_update, module_progress, module_completed, preview_ready, incremental_summary, resync_required, and terminal job_completed/job_failed/job_cancelled events with 15s heartbeat comments.
      responses:
        '200':
          description: Chunked text/event-stream ending cleanly after terminal job completion or failure.
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/analysis/jobs/{job}/repository-score:
    parameters: [{$ref: '#/components/parameters/Job'}]
    get:
      operationId: publishedRepositoryScore
      description: Applies the repository rubric as soon as the analysis job has sealed its acquisition inventory. The graph field is null before semantic publication.
      responses:
        '200': {description: Score and evidence from the captured repository inventory}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: customPublishedRepositoryScore
      description: Computes the rubric with exact path overrides on the job's sealed inventory.
      requestBody: {$ref: '#/components/requestBodies/RepositoryScorePaths'}
      responses:
        '200': {description: Repository score with the selected overrides}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/analysis/jobs/{job}/telemetry:
    parameters: [{$ref: '#/components/parameters/Job'}]
    get:
      operationId: analysisJobTelemetry
      description: Operational per-stage millisecond execution telemetry and mode/reuse status. Mode is null when an older receipt did not record it. Operational timing never enters canonical graph or report digests.
      responses:
        '200': {$ref: '#/components/responses/JobSuccess'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/analysis/jobs/{job}/cancel:
    parameters: [{$ref: '#/components/parameters/Job'}]
    post:
      operationId: cancelAnalysis
      description: Idempotent cancellation. Running work remains CANCELLING until the worker acknowledges termination. Terminal results do not change.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '202': {$ref: '#/components/responses/JobDetail'}
        '200': {$ref: '#/components/responses/JobDetail'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/analysis/jobs/{job}/coverage:
    parameters: [{$ref: '#/components/parameters/Job'}]
    get:
      operationId: analysisJobCoverage
      description: Published completion and union gap total, with up to eight reason counts over the first 2000 job ledger records. Included and total ledger counts identify the denominator.
      responses:
        '200': {$ref: '#/components/responses/JobSuccess'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/analysis/jobs/{job}/gaps:
    parameters: [{$ref: '#/components/parameters/Job'}]
    post:
      operationId: analysisJobGaps
      description: Supplemental typed job/policy gaps after completion. Canonical graph gaps remain available through graph/context queries. Receipt gapCount is the unique union, not the sum of these overlapping populations.
      requestBody: {$ref: '#/components/requestBodies/JobPage'}
      responses:
        '200': {$ref: '#/components/responses/JobSuccess'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/analysis/jobs/{job}/input-diagnostics:
    parameters: [{$ref: '#/components/parameters/Job'}]
    post:
      operationId: analysisInputDiagnostics
      description: Original typed acquisition problems with provider and acquisition SHA-256 references, including failures before a snapshot exists. No synthetic snapshot or analysis identity is invented.
      requestBody: {$ref: '#/components/requestBodies/JobPage'}
      responses:
        '200': {$ref: '#/components/responses/JobSuccess'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/auth/status:
    get:
      operationId: githubAuthStatus
      description: Safe GitHub authentication status (authenticated, source, host, login, scopes, canPushAndOpenPr, rateLimit). Never returns any token or secret.
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/auth/session:
    post:
      operationId: setGithubSessionToken
      description: Store a RAM-only GitHub PAT for the active local Workbench process after verifying it against GitHub /user. Never persisted to disk or echoed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, minLength: 1, maxLength: 512}
                host: {type: string, maxLength: 253}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: clearGithubSessionToken
      description: Zero and clear the RAM-only GitHub session PAT.
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/refs:
    get:
      operationId: githubRepoRefsGet
      description: Pre-connect discovery of repository metadata, branches, tags, and open pull requests for an allowlisted GitHub repository URL or owner/repo coordinate.
      parameters:
        - {name: repo, in: query, required: true, schema: {type: string, maxLength: 1024}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: githubRepoRefsPost
      description: POST alternative for pre-connect discovery of GitHub repository refs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [repo]
              properties:
                repo: {type: string, maxLength: 1024}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/connections/{setup}/metadata:
    parameters:
      - {name: setup, in: path, required: true, schema: {$ref: '#/components/schemas/JobIdentifier'}}
    get:
      operationId: githubConnectionMetadata
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/connections/{setup}/branches:
    parameters:
      - {name: setup, in: path, required: true, schema: {$ref: '#/components/schemas/JobIdentifier'}}
    get:
      operationId: githubConnectionBranches
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/connections/{setup}/tags:
    parameters:
      - {name: setup, in: path, required: true, schema: {$ref: '#/components/schemas/JobIdentifier'}}
    get:
      operationId: githubConnectionTags
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/connections/{setup}/commits:
    parameters:
      - {name: setup, in: path, required: true, schema: {$ref: '#/components/schemas/JobIdentifier'}}
      - {name: sha, in: query, required: false, schema: {type: string, maxLength: 256}}
    get:
      operationId: githubConnectionCommits
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/connections/{setup}/pulls:
    parameters:
      - {name: setup, in: path, required: true, schema: {$ref: '#/components/schemas/JobIdentifier'}}
      - {name: state, in: query, required: false, schema: {type: string, enum: [open, closed, all]}}
    get:
      operationId: githubConnectionPulls
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/connections/{setup}/pulls/{number}:
    parameters:
      - {name: setup, in: path, required: true, schema: {$ref: '#/components/schemas/JobIdentifier'}}
      - {name: number, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      operationId: githubConnectionPullDetail
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/connections/{setup}/pulls/{number}/checks:
    parameters:
      - {name: setup, in: path, required: true, schema: {$ref: '#/components/schemas/JobIdentifier'}}
      - {name: number, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      operationId: githubConnectionPullChecks
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/connections/{setup}/compare:
    parameters:
      - {name: setup, in: path, required: true, schema: {$ref: '#/components/schemas/JobIdentifier'}}
    post:
      operationId: githubCompareArchitecture
      description: Analyze and compare a GitHub PR (base vs head, supporting fork refs) or any two refs/branches, returning Architecture Score v2 deltas (D1-D7), semantic gap deltas, blast radius, and Markdown review report.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                pullNumber: {type: integer, minimum: 1}
                baseRef: {type: string, maxLength: 256}
                headRef: {type: string, maxLength: 256}
                mode: {type: string, enum: [FULL, FAST_ARCHITECTURE], default: FAST_ARCHITECTURE}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/comparisons/{diffId}:
    parameters:
      - {name: diffId, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{16,64}$'}}
    get:
      operationId: githubGetComparison
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/connections/{setup}/pulls/{number}/review-comment:
    parameters:
      - {name: setup, in: path, required: true, schema: {$ref: '#/components/schemas/JobIdentifier'}}
      - {name: number, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      operationId: githubPostReviewComment
      description: Explicitly user-confirmed idempotent PR architecture review comment publication bound to a pinned diffDigest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmedByUser]
              properties:
                diffId: {type: string, pattern: '^[a-f0-9]{16,64}$'}
                diffDigest: {$ref: '#/components/schemas/Digest'}
                bodyMarkdown: {type: string, maxLength: 65536}
                confirmedByUser: {type: boolean}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/repairs/prepare:
    post:
      operationId: githubPrepareRepairPr
      description: Step 1 (dry-run, zero Git/GitHub writes) generating a pinned publishPlanDigest, single-use confirmationToken, diff stats, and Markdown Verification Report.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proposalId]
              properties:
                proposalId: {$ref: '#/components/schemas/Digest'}
                setupId: {$ref: '#/components/schemas/JobIdentifier'}
                setup: {$ref: '#/components/schemas/JobIdentifier'}
                repoCoordinate: {type: string, maxLength: 1024}
                baseBranch: {type: string, maxLength: 128}
                headBranch: {type: string, maxLength: 128}
                title: {type: string, maxLength: 200}
                draft: {type: boolean}
                allowUnverified: {type: boolean, default: false}
                verificationJobId: {type: string, format: uuid}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/repairs/publish:
    post:
      operationId: githubPublishRepairPr
      description: Step 2 (strictly gated by confirmedByUser=true, single-use confirmationToken, and publishPlanDigest) applying verified patch to a non-default branch, pushing without --force, and opening a GitHub Pull Request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmationToken, publishPlanDigest, confirmedByUser]
              properties:
                confirmationToken: {type: string, minLength: 32, maxLength: 128}
                publishPlanDigest: {$ref: '#/components/schemas/Digest'}
                confirmedByUser: {type: boolean}
                title: {type: string, maxLength: 200}
                bodyMarkdown: {type: string, maxLength: 65536}
                draft: {type: boolean}
                allowUnverified: {type: boolean}
      responses:
        '201': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/config:
    get:
      operationId: authConfig
      description: Advertise configured multi-user authentication modes (local accounts, OAuth Web PKCE, Device Flow, 1-Click GitHub App Manifest, Session PAT, local fallback), setup status, and deployment origin metadata (publicBaseUrl, callbackUrl, webhookUrl, isLoopbackHost, webhookReachable).
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/me:
    get:
      operationId: authMe
      description: Return the current authenticated user profile (including role and GitHub link status), session CSRF token, and GitHub rate limit without exposing secrets.
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/register:
    post:
      operationId: authRegister
      description: Register a new built-in workspace user account (PBKDF2WithHmacSHA256 210k iterations; first user becomes ADMIN, subsequent users MEMBER) and set HttpOnly evo_session cookie. Username is optional; when omitted or blank, a clean lowercase handle ([a-z0-9_-], length 2..40, avoiding reserved 'local') is derived from the email prefix with -2, -3 suffixes on collision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, maxLength: 254}
                username: {type: string, minLength: 2, maxLength: 40}
                displayName: {type: string, maxLength: 120}
                password: {type: string, minLength: 8, maxLength: 128}
      responses:
        '201': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/login:
    post:
      operationId: authLogin
      description: Authenticate an existing built-in workspace account by email or username using constant-time PBKDF2 verification and set HttpOnly evo_session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [identifier, password]
              properties:
                identifier: {type: string, maxLength: 254}
                password: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/profile:
    post:
      operationId: authProfileUpdate
      description: Update authenticated user display name and/or password (requires session cookie and X-Evo-CSRF).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName: {type: string, maxLength: 120}
                currentPassword: {type: string, maxLength: 128}
                newPassword: {type: string, minLength: 8, maxLength: 128}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/github/unlink:
    post:
      operationId: authGitHubUnlink
      description: Unlink GitHub identity and revoke stored GitHub OAuth/PAT tokens on the current session while keeping the local workspace account signed in.
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/users:
    get:
      operationId: authListUsers
      description: List all registered multi-user workspace accounts (ADMIN only; zero password hashes or tokens exposed).
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/users/{userId}/role:
    post:
      operationId: authUpdateUserRole
      description: Update a workspace user's role (ADMIN or MEMBER) and/or disabled status (ADMIN only + X-Evo-CSRF; protects the last active admin).
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: {type: string, enum: [ADMIN, MEMBER]}
                disabled: {type: boolean}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/tokens:
    get:
      operationId: authListTokens
      description: List scoped Personal Access Token metadata belonging exclusively to the signed-in user (SHA-256 hash-only storage; zero raw tokens or hashes returned).
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: authMintToken
      description: Mint a scoped Personal Access Token (evo_pat_...) for MCP or API access (CSRF-protected; plaintext returned exactly once).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [label]
              properties:
                label: {type: string, minLength: 1, maxLength: 80}
                scopes:
                  type: array
                  items: {type: string, enum: ['mcp:read', 'api:read', 'api:write']}
                expiresInDays: {type: integer, minimum: 1, maximum: 365, default: 90}
      responses:
        '201': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/tokens/{tokenId}:
    delete:
      operationId: authRevokeToken
      description: Revoke a scoped Personal Access Token (owner or ADMIN only + X-Evo-CSRF).
      parameters:
        - {name: tokenId, in: path, required: true, schema: {type: string, maxLength: 64}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/github/setup:
    get:
      operationId: authGitHubSetupGet
      description: Inspect current GitHub OAuth / App setup status, auto-detected publicBaseUrl, callbackUrl, webhookUrl, isLoopbackHost, and webhookReachable flags without exposing client or webhook secrets.
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: authGitHubSetupSave
      description: Encrypt, persist, and live hot-reload in-app GitHub OAuth and webhook credentials (ADMIN or initial first-run setup; zero server restart required).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientId]
              properties:
                clientId: {type: string, minLength: 1, maxLength: 256}
                clientSecret: {type: string, maxLength: 512}
                host: {type: string, maxLength: 256}
                webhookSecret: {type: string, maxLength: 512}
                deviceFlowEnabled: {type: boolean}
                publicBaseUrl: {type: string, maxLength: 512}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: authGitHubSetupClear
      description: Clear saved in-app encrypted GitHub OAuth credentials and hot-reload effective configuration live (ADMIN + X-Evo-CSRF).
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/github/manifest/prepare:
    post:
      operationId: authGitHubManifestPrepare
      description: Generate an official 1-click GitHub App Manifest JSON payload, actionUrl, and single-use state token (ADMIN or initial first-run setup). Sets hook_attributes.active=false on loopback origins so localhost registration succeeds cleanly, and hook_attributes.active=true when webhookReachable is true (non-loopback https://).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                appName: {type: string, maxLength: 64}
                host: {type: string, maxLength: 256}
                publicBaseUrl: {type: string, maxLength: 512}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/github/manifest/callback:
    get:
      operationId: authGitHubManifestCallback
      description: Verify single-use manifest state, convert temporary code via GitHub App Manifest conversions API, encrypt and hot-reload credentials live, and redirect back to Workbench.
      parameters:
        - {name: code, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
      responses:
        '302': {description: Redirect to Workbench after live GitHub App configuration.}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/github/login:
    get:
      operationId: authGitHubLogin
      description: Start GitHub OAuth 2.0 Web Application Flow with PKCE S256 and single-use state, returning a 302 redirect.
      parameters:
        - {name: returnTo, in: query, required: false, schema: {type: string, maxLength: 512}}
      responses:
        '302': {description: Redirect to GitHub OAuth authorize endpoint.}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/github/callback:
    get:
      operationId: authGitHubCallback
      description: Complete GitHub OAuth Web callback, set HttpOnly SameSite=Lax evo_session cookie, and redirect back to Workbench.
      parameters:
        - {name: code, in: query, required: false, schema: {type: string}}
        - {name: state, in: query, required: false, schema: {type: string}}
        - {name: error, in: query, required: false, schema: {type: string}}
      responses:
        '302': {description: Redirect to Workbench with session cookie set.}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/github/device/start:
    post:
      operationId: authGitHubDeviceStart
      description: Start GitHub OAuth Device Authorization Flow (RFC 8628) returning a user code and verification URI.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scopes: {type: string, maxLength: 512}
                host: {type: string, maxLength: 256}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/github/device/poll:
    post:
      operationId: authGitHubDevicePoll
      description: Poll GitHub Device Flow status; sets HttpOnly evo_session cookie and returns user plus csrfToken when AUTHORIZED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deviceFlowId]
              properties:
                deviceFlowId: {type: string, minLength: 8, maxLength: 256}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/logout:
    post:
      operationId: authLogout
      description: Revoke current user session and clear evo_session cookie.
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/logout-all:
    post:
      operationId: authLogoutAll
      description: Revoke all active sessions for the current authenticated user and clear evo_session cookie.
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/orgs:
    get:
      operationId: githubUserOrgs
      description: List GitHub organizations for the authenticated user session.
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/user/repos:
    get:
      operationId: githubUserRepos
      description: List and search personal or organization GitHub repositories for 1-click Workbench import.
      parameters:
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 256}}
        - {name: org, in: query, required: false, schema: {type: string, maxLength: 100}}
        - {name: visibility, in: query, required: false, schema: {type: string, enum: [all, public, private]}}
        - {name: sort, in: query, required: false, schema: {type: string, enum: [updated, pushed, full_name, created]}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/webhooks:
    post:
      operationId: githubWebhookReceive
      description: Receive GitHub webhook deliveries verified via constant-time HMAC-SHA256 X-Hub-Signature-256 and X-GitHub-Delivery replay dedup.
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '202': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/webhooks/deliveries:
    get:
      operationId: githubWebhookDeliveries
      description: List recent sanitized GitHub webhook deliveries and ChatOps commands.
      responses:
