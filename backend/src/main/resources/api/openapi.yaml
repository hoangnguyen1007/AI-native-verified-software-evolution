    get:
      operationId: getChatConversation
      description: Load a persistent chat conversation and its ordered redacted turns. Enforces strict tenant isolation (403 ACCESS_DENIED for foreign owner, 404 CONVERSATION_NOT_FOUND when missing). Allows api:read, mcp:read, and api:write PATs.
      responses:
        '200':
          description: Conversation metadata and ordered turn history.
          content:
            application/json:
              schema:
                allOf:
