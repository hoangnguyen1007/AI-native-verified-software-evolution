  /api/v1/graphs/{graph}/queries/code-search:
    parameters:
      - {$ref: '#/components/parameters/Graph'}
    post:
      operationId: queryCodeSearch
      description: Pre-redacted SQLite FTS5 BM25 (or streaming CAS fallback) code search pinned to this graph with deterministic tie-breaking, TrustTier provenance, Shannon-entropy secret pre-redaction, and honest omittedFiles accounting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: {type: string, minLength: 1, maxLength: 512}
                languages:
                  type: array
                  maxItems: 32
                  items: {type: string, minLength: 1, maxLength: 64}
                includeAdvisory: {type: boolean, default: true}
                limit: {type: integer, minimum: 1, maximum: 100, default: 25}
                offset: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200':
          description: Pre-redacted code search hits with engine, omittedFiles, redactedSecretCount, and per-hit SemanticTrustTier provenance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiVersion: {type: string}
                  queryVersion: {type: string}
                  resultIdentity: {type: string}
                  data:
                    type: object
                    properties:
                      graph: {type: string}
                      query: {type: string}
                      engine: {type: string, enum: [SQLITE_FTS5_BM25, STREAMING_FALLBACK]}
                      totalHits: {type: integer, minimum: 0}
                      truncated: {type: boolean}
                      omittedFiles: {type: integer, minimum: 0}
                      redactedSecretCount: {type: integer, minimum: 0}
                      offset: {type: integer, minimum: 0}
                      limit: {type: integer, minimum: 1}
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            path: {type: string}
                            startLine: {type: integer, minimum: 1}
                            endLine: {type: integer, minimum: 1}
                            score: {type: number}
                            snippet: {type: string}
                            contentSha256: {type: string}
                            language: {type: string}
                            trustTier: {$ref: '#/components/schemas/SemanticTrustTier'}
                            isAdvisory: {type: boolean}
                            redactedCount: {type: integer, minimum: 0}
        default: {$ref: '#/components/responses/Error'}
