    parameters:
      - {$ref: '#/components/parameters/Graph'}
      - in: path
        name: operation
        required: true
        schema:
          type: string
          enum: [summary, provenance, entities, entity, edges, dependencies, relationships, expand, paths, shortest-path, cycles, reachability, impact, evidence, explain, gaps, spring, configurations, artifacts, metric-catalog, metric, comparison-preparation, visual-graph, children, realizations, metric-definition]
    post:
      operationId: query
      description: Read-only POST supports structured filters. Arguments are operation-specific; see the M7.1 architecture contract. Domain PARTIAL/CANCELLED results use HTTP 200 and retain their gaps and bounds.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueryCall'}
      responses:
        '200': {$ref: '#/components/responses/QuerySuccess'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/graphs/{graph}/reports/{report}:
    parameters:
      - {$ref: '#/components/parameters/Graph'}
      - {$ref: '#/components/parameters/Report'}
    get:
      operationId: publishedReportSummary
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/graphs/{graph}/reports/{report}/{operation}:
    parameters:
      - {$ref: '#/components/parameters/Graph'}
      - {$ref: '#/components/parameters/Report'}
      - in: path
        name: operation
        required: true
        schema:
          type: string
          enum: [rules, findings, finding, bundle, policy-metrics, assessment, policy-impact, visual-graph, replay, diagnosis, repair-options, repair-proposal, repair-reanalysis, repair-verification]
    post:
      operationId: publishedReportArtifact
      description: >-
        Returns immutable canonical results or a diagnosis proposal. Replay checks the published finding predicate
        and captured witness through bounded canonical region reasoning. Diagnosis requires arguments identity (finding
        digest), bundle (evidence bundle digest), and context (graph context identity), with no page.
        It returns CITATIONS_VALIDATED or a typed WITHHELD result, labeled LOCAL_REPLAY by default or LIVE when
        configured by the local operator for one exact diagnosis input. The request cannot select a provider.
        Repair-options adds the exact diagnosisInput digest and returns the recipe catalog, applicableRecipes, isolatedRunnerConfigured,
        captured-source eligibility and, when configured, the exact AI input digest and files that would be sent. It does not call the model.
        Repair-proposal accepts the same pins with strategy RECIPE and a registered recipe ID in recipe,
        or strategy AI (with optional maxRepairAttempts 1..3) and the exact modelInput digest from repair-options. The latter authorizes sending that
        input to the operator-configured endpoint. Both strategies require compiler syntax checks of all changes
        before creating a Git patch and return UNVERIFIED or WITHHELD. Omitting strategy selects the legacy demo.
        Repair independently replays canonical evidence.
        Missing artifacts return 404. Mismatched pins return 409.
        Repair-verification also requires the proposal digest and accepts optional published candidateReport, controlReport digests,
        and optional strict boolean runIsolated (returning 422 ISOLATED_RUNNER_NOT_CONFIGURED or ISOLATED_RUNNER_REPO_UNAVAILABLE if unavailable).
        It returns the pinned verification plan, per-check outcomes and a local verdict.
        When available, the candidate comparison includes a checked bindingCensus for the sealed demo source inventory.
        The census supports the resolved route in the demo profile scope and preserves aggregate coverage qualifications.
        VERIFIED_DEMO requires an operator-pinned capture for the sealed two-profile fixture. VERIFIED requires the general evidence contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                arguments: {type: object, description: 'Finding/bundle/policy-impact require identity. Replay requires finding identity and boolean counterWitness. Diagnosis requires finding identity, bundle digest and context. Repair-proposal also requires diagnosisInput. See the workbench contract for visual-graph operands.'}
                page: {$ref: '#/components/schemas/Page'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/analysis/connections:
    get:
      operationId: repositoryConnections
