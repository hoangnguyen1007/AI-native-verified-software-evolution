          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [registration]
              properties:
                registration: {$ref: '#/components/schemas/Digest'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
components:
  # The semantic adapter has its own version and does not add queryVersion.
  requestBodies:
    RepositoryScorePaths:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [paths]
            properties:
              paths:
                type: object
                additionalProperties: false
                properties:
                  documentation: {type: string, maxLength: 1024}
                  tests: {type: string, maxLength: 1024}
                  automation: {type: string, maxLength: 1024}
                  build: {type: string, maxLength: 1024}
    EvolutionEmpty:
      required: true
      content:
        application/json:
          schema: {type: object, maxProperties: 0}
    EvolutionPage:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/EvolutionPage'}
    JobPage:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Page'}
  parameters:
    EvolutionResult:
      in: path
      name: result
      required: true
      schema: {$ref: '#/components/schemas/Digest'}
    Job:
      in: path
      name: job
      required: true
      schema: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
    Graph:
      in: path
      name: graph
      required: true
      schema: {$ref: '#/components/schemas/Digest'}
    Report:
      in: path
      name: report
      required: true
      schema: {$ref: '#/components/schemas/Digest'}
  responses:
    EvolutionSuccess:
      description: Versioned data. The resultIdentity hashes the redacted canonical data. Domain COMPLETE, PARTIAL and WITHHELD are valid results.
      content:
        application/json:
          schema:
            type: object
            required: [apiVersion, resultIdentity, data]
            additionalProperties: false
            properties:
              apiVersion: {const: 'architecture.evolution.query:v1'}
              resultIdentity: {$ref: '#/components/schemas/Digest'}
              data: {type: object}
    EvolutionError:
      description: Invalid request or foreign cursor (400), absent artifact (404), idempotency conflict or cancellation (409), request or response limit (413/422), unavailable worker or integrity failure (503).
      content:
        application/json:
          schema:
            type: object
            required: [apiVersion, error]
            properties:
              apiVersion: {type: string}
              error: {type: object, required: [code], properties: {code: {type: string}}}
    BridgeSuccess:
      description: architecture.bridge-query:m8.4-v1 data. Counts/revision/cursor positions are lossless decimal strings. Summary accounting separates concrete bindings from endpoint-free evidence obligations, retaining their per-state sum and original outcomes. Context states describe captured children, not method qualification. Canonical data identity includes the complete selected view. Trust remains PRODUCER_ASSERTION; qualified and complete remain false, assessment WITHHELD. Exact declaration matching is distinct from semantic authority, deployed reachability and observed traffic.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [apiVersion, resultIdentity, data]
            properties:
              apiVersion: {const: 'architecture.bridge-query:m8.4-v1'}
              resultIdentity: {$ref: '#/components/schemas/Digest'}
              data: {type: object}
    BridgeError:
      description: Invalid selection/budget (400), absent scope (404), stale cursor, revoked policy or cancellation (409), request/JSON/response limits (413/422), unavailable/corrupt capture or absent operator composition (503). The shared HTTP transport retains its existing media/origin/deadline errors. No worker or target code is launched.
      content:
        application/json:
          schema:
            type: object
            required: [apiVersion, error]
            properties:
              apiVersion: {type: string, enum: ['architecture.bridge-query:m8.4-v1', 'architecture.http:m7.1-v1']}
              error: {type: object, required: [code], properties: {code: {type: string}}}
    SemanticSuccess:
      description: Canonical semantic.query:m8.4-v1 summary or context/gap/answer page. An operator-composed live validator rechecks signatures, registered methods, exact input closures, current policy and revocations before returning VALIDATED_OBSERVATION and CURRENT_POLICY_VALIDATED. Authenticated results may remain incomplete because semantic gaps persist. Without that capability, trust is PRODUCER_ASSERTION, qualification UNQUALIFIED and complete false. Retained history can remain readable when the current provider is missing or failed; it never changes that operational state. Revision, coverage counts, gap counts and pagination row counts are lossless decimal strings. The data identity hashes canonical UTF-8 JSON.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [apiVersion, resultIdentity, data]
            properties:
              apiVersion: {const: 'semantic.query:m8.4-v1'}
              resultIdentity: {$ref: '#/components/schemas/Digest'}
              data: {type: object}
    SemanticError:
      description: 400 invalid shape/cursor/size; 403 local-origin guard; 404 absent plan/context/route; 405 method; 406 Accept; 409 stale cursor, revoked policy or cancellation; 413 request/JSON limit; 415 media; 422 response limit; 503 unavailable/corrupt publication or absent operator composition. Shared HTTP transport errors retain the architecture envelope version. No worker is started.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [apiVersion, error]
            properties:
              apiVersion: {type: string, enum: ['semantic.query:m8.4-v1', 'architecture.http:m7.1-v1']}
              queryVersion: {type: string}
              error:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: {type: string}
                  message: {type: string}
    JobSuccess:
      description: Bounded job data. Operational UUIDs, revisions and times never enter canonical analysis identities. History and job state are process-local; graph snapshots persist in the configured store.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - required: [jobVersion]
    JobDetail:
      description: Current job state and published canonical artifact identities, when available.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - required: [jobVersion]
                properties:
                  data: {$ref: '#/components/schemas/AnalysisJob'}
    JobHistory:
      description: Bounded history with stable membership and explicit total/continuation; item states remain live.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - required: [jobVersion]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [items, total, continuation]
                    properties:
                      items: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/AnalysisJob'}}
                      total: {type: integer, minimum: 0}
                      continuation: {type: [string, 'null'], maxLength: 512}
    Success:
      description: Canonical data with SHA-256 of its canonical UTF-8 JSON. Cache-Control is no-store.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
    QuerySuccess:
      description: Canonical query result, including honest partial/withheld/cancellation states.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - properties:
                  data: {$ref: '#/components/schemas/QueryResult'}
    Error:
      description: '400 invalid request; 403 origin; 404 absent route/graph/report/artifact/setup/job; 405 method; 406 Accept; 409 retry conflict/unfinished job/request cancelled/PRELIMINARY_GRAPH_PENDING; 410 PREVIEW_SUPERSEDED (with optional error.supersededBy digest); 413 input limit; 415 media/encoding; 422 response limit; 500 internal; 503 storage/busy/job queue/history full/closed/unconfigured. Transport interruption may close the connection before a response is possible.'
      content:
        application/json:
          schema:
            type: object
            required: [apiVersion, queryVersion, error]
            additionalProperties: false
            properties:
              apiVersion: {const: 'architecture.http:m7.1-v1'}
              queryVersion: {$ref: '#/components/schemas/Version'}
              jobVersion: {const: 'architecture.jobs:m8.1-v1'}
              error:
                type: object
                required: [code, message]
                additionalProperties: false
                properties:
                  code: {type: string}
                  message: {type: string}
                  supersededBy: {$ref: '#/components/schemas/Digest'}
  schemas:
    EvolutionRequest:
      type: object
      additionalProperties: false
      required: [schema, comparison]
      properties:
        schema: {const: 'architecture.evolution.request:v1'}
        comparison:
          type: object
          additionalProperties: false
          required: [repository, left, right, mode, selection]
          properties:
            repository: {type: string, pattern: '^repository:sha256:[0-9a-f]{64}$'}
            left: {$ref: '#/components/schemas/Digest'}
            right: {$ref: '#/components/schemas/Digest'}
            mode: {enum: [STRICT, OBSERVATION]}
            selection: {$ref: '#/components/schemas/EvolutionSelection'}
        reports:
          type: array
          uniqueItems: true
          items:
            type: object
            required: [side, identity, context]
            additionalProperties: false
            properties:
              side: {enum: [LEFT, RIGHT]}
              identity: {$ref: '#/components/schemas/Digest'}
              context: {type: string}
        bridges:
          type: array
          maxItems: 2
          items:
            type: object
            required: [side, publication]
            additionalProperties: false
            properties:
              side: {enum: [LEFT, RIGHT]}
              publication:
                type: object
                required: [digest, size]
                additionalProperties: false
                properties:
                  digest: {$ref: '#/components/schemas/Digest'}
                  size: {type: integer, minimum: 0}
        history:
          oneOf:
            - {type: 'null'}
            - type: object
              required: [steps]
              additionalProperties: false
              properties:
                steps:
                  type: array
                  minItems: 2
                  items:
                    type: object
                    additionalProperties: false
                    required: [revision, interval]
                    properties:
                      revision: {$ref: '#/components/schemas/EvolutionHistoryRevision'}
                      interval:
                        oneOf:
                          - {type: 'null'}
                          - {$ref: '#/components/schemas/Digest'}
    EvolutionHistoryRevision:
      type: object
      required: [graph, reports]
      additionalProperties: false
      properties:
        graph: {$ref: '#/components/schemas/Digest'}
        reports:
          type: array
          uniqueItems: true
          items:
            type: object
            required: [identity, context]
            additionalProperties: false
            properties:
              identity: {$ref: '#/components/schemas/Digest'}
              context: {type: string}
    EvolutionSelection:
      type: object
      required: [sourceSets, nodeKinds, relationshipKinds, conditional, evidence, findings, metrics, score]
      additionalProperties: false
      properties:
        sourceSets: {type: array, uniqueItems: true, items: {type: string}}
        nodeKinds: {type: array, uniqueItems: true, items: {type: string}}
        relationshipKinds: {type: array, uniqueItems: true, items: {type: string}}
        conditional: {type: boolean}
        evidence: {type: boolean}
        findings: {type: boolean}
        metrics: {type: boolean}
        score: {type: boolean}
    EvolutionPage:
      type: object
      required: [section]
      additionalProperties: false
      properties:
        section: {enum: [CONTEXTS, COMPATIBILITY, CORRESPONDENCE, EVENTS, GAPS, INPUTS, REGIONS, PROOFS, EVIDENCE, FINDINGS, HISTORY, METRICS, SCORES]}
        size: {type: integer, minimum: 1, maximum: 50, default: 20}
        cursor: {type: string}
        filter:
          type: object
          additionalProperties: false
          properties:
            side: {enum: [LEFT, RIGHT]}
            kind: {type: string, minLength: 1, maxLength: 512}
            scope: {type: string, minLength: 1, maxLength: 512}
            subject: {type: string, minLength: 1, maxLength: 512}
    BridgeScopeFields:
      type: object
      required: [scope]
      properties:
        scope: {$ref: '#/components/schemas/Digest'}
    BridgeScopeQuery:
      allOf: [{$ref: '#/components/schemas/BridgeScopeFields'}]
      unevaluatedProperties: false
    BridgeCursor:
      type: object
      additionalProperties: false
      required: [request, position]
      properties:
        request: {$ref: '#/components/schemas/Digest'}
        position:
          type: object
          additionalProperties: false
          required: [table, rows, previousKey]
          properties:
            table: {$ref: '#/components/schemas/Digest'}
            rows: {type: string, pattern: '^(0|[1-9][0-9]{0,18})$'}
            previousKey: {type: [string, 'null']}
    SemanticCount: {type: string, pattern: '^(0|[1-9][0-9]{0,18})$', description: Exact nonnegative signed-64-bit decimal counter; never binary floating point.}
    SemanticCursor:
      type: object
      additionalProperties: false
      required: [publication, table]
      properties:
        publication: {$ref: '#/components/schemas/Digest'}
        table:
          type: object
          additionalProperties: false
          required: [table, rows, previousKey]
          properties:
            table: {$ref: '#/components/schemas/Digest'}
            rows: {$ref: '#/components/schemas/SemanticCount'}
            previousKey: {type: [string, 'null']}
    SemanticPageQuery:
      type: object
      required: [plan]
      properties:
        plan: {$ref: '#/components/schemas/Digest'}
        size: {type: integer, minimum: 1, maximum: 50, default: 20}
        cursor:
          oneOf:
            - {$ref: '#/components/schemas/SemanticCursor'}
            - {type: 'null'}
    JobIdentifier: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$', maxLength: 64}
    JobStage: {type: string, enum: [QUEUED, ACQUISITION, PLATFORM, ANALYSIS, GRAPH, POLICY, PUBLICATION, REUSED, FINISHED]}
    AnalysisJob:
      type: object
      additionalProperties: false
      required: [id, setup, state, stage, revision, submittedAt, startedAt, finishedAt, elapsedMillis, stop, error, events, result]
      properties:
        id: {type: string, format: uuid}
        setup: {$ref: '#/components/schemas/JobIdentifier'}
        state: {type: string, enum: [QUEUED, RUNNING, CANCELLING, SUCCEEDED, PARTIAL, EMPTY, FAILED, CANCELLED, TIMED_OUT]}
        stage: {$ref: '#/components/schemas/JobStage'}
        revision: {type: integer, minimum: 1}
        submittedAt: {type: string, format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        elapsedMillis: {type: integer, minimum: 0}
        force: {type: boolean, default: false}
        mode: {type: [string, 'null'], enum: [FULL, FAST_ARCHITECTURE, null]}
        reuseDecision: {type: [string, 'null'], enum: [INPUTS_UNVERIFIED, NO_MATCH, RESULT_UNAVAILABLE, BYPASSED, REUSED, null]}
        reuse:
          description: Present when this job verified its inputs and reused an earlier published result.
          anyOf:
            - {type: 'null'}
            - type: object
              additionalProperties: false
              required: [sourceJob, sourceFinishedAt, verifiedAt]
              properties:
                sourceJob: {type: string, format: uuid}
                sourceFinishedAt: {type: string, format: date-time}
                verifiedAt: {type: string, format: date-time}
        stop: {type: [string, 'null'], enum: [USER_CANCELLED, DEADLINE_EXCEEDED, SERVICE_CLOSED, PROVIDER_INTERRUPTED, null]}
        error: {type: [string, 'null'], enum: [ANALYSIS_FAILED, RESULT_STORAGE_FAILED, RESULT_PUBLICATION_FAILED, SEMANTIC_WORKER_REQUIRED, JOB_STORAGE_UNAVAILABLE, SETUP_CONFIGURATION_CHANGED, null]}
        events:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [stage, at]
            properties:
              stage: {$ref: '#/components/schemas/JobStage'}
              at: {type: string, format: date-time}
        result:
          anyOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/AnalysisResult'}
        publicationStage: {$ref: '#/components/schemas/TruthTier'}
        previewGraphId: {anyOf: [{$ref: '#/components/schemas/Digest'}, {type: 'null'}]}
        preview: {anyOf: [{$ref: '#/components/schemas/PreviewPublication'}, {type: 'null'}]}
        incremental: {anyOf: [{$ref: '#/components/schemas/IncrementalMetrics'}, {type: 'null'}]}
    TruthTier:
      type: string
      enum: [NONE, PRELIMINARY_STRUCTURE, PARTIAL_CONTEXTS, DEEP_SEMANTIC_COMPLETE]
    SemanticTrustTier:
      type: string
      enum: [COMPILER, SPRING_SAT, SOURCE_SYNTAX, ADVISORY_UNVERIFIED]
    ProjectionLevel:
      type: string
      enum: [AUTO, MACRO, MESO, MICRO]
      default: AUTO
    CycleMode:
      type: string
      enum: [SCC, ELEMENTARY]
      default: SCC
    DsmGranularity:
      type: string
      enum: [MODULE, PACKAGE, TYPE]
      default: PACKAGE
    DsmItem:
      type: object
      additionalProperties: false
      required: [index, id, label, kind, inDegree, outDegree, sccIndex, trustTier]
      properties:
        index: {type: integer, minimum: 0}
        id: {type: string}
        label: {type: string}
        kind: {type: string}
        communityId: {type: string}
        inDegree: {type: integer, minimum: 0}
        outDegree: {type: integer, minimum: 0}
        sccIndex: {type: integer, minimum: 0}
        trustTier: {$ref: '#/components/schemas/SemanticTrustTier'}
    DsmSccBlock:
      type: object
      additionalProperties: false
      required: [index, start, end, size, cyclic, level, members]
      properties:
        index: {type: integer, minimum: 0}
        start: {type: integer, minimum: 0}
        end: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        cyclic: {type: boolean}
        level: {type: integer, minimum: 0}
        members: {type: array, items: {type: string}}
    DsmCell:
      type: object
      additionalProperties: false
      required: [r, c, weight, isCycle, isViolation, trustTier]
      properties:
        r: {type: integer, minimum: 0}
        c: {type: integer, minimum: 0}
        weight: {type: integer, minimum: 1}
        isCycle: {type: boolean}
        isViolation: {type: boolean}
        trustTier: {$ref: '#/components/schemas/SemanticTrustTier'}
    DsmMatrixResponse:
      type: object
      additionalProperties: false
      required: [graphDigest, context, granularity, levelizationScore, totalItems, truncated, order, sccBlocks, cells]
      properties:
        graphDigest: {$ref: '#/components/schemas/Digest'}
        context: {type: string}
        granularity: {$ref: '#/components/schemas/DsmGranularity'}
        communityId: {type: string}
        levelizationScore: {type: number, minimum: 0, maximum: 1}
        totalItems: {type: integer, minimum: 0}
        truncated: {type: boolean}
        order: {type: array, items: {$ref: '#/components/schemas/DsmItem'}}
        sccBlocks: {type: array, items: {$ref: '#/components/schemas/DsmSccBlock'}}
        cells: {type: array, items: {$ref: '#/components/schemas/DsmCell'}}
    ResolvedCitation:
      type: object
      additionalProperties: false
      required: [id, kind, label, nodeIds, trustTier]
      properties:
        id: {type: string}
        kind: {type: string}
        label: {type: string}
        nodeIds: {type: array, items: {type: string}}
        path: {type: [string, 'null']}
        startLine: {type: [integer, 'null'], minimum: 1}
        endLine: {type: [integer, 'null'], minimum: 1}
        trustTier: {$ref: '#/components/schemas/SemanticTrustTier'}
    ChatConversationSummary:
      type: object
      additionalProperties: false
      required: [conversationId, graphDigest, snapshotDigest, contextId, mode, title, archived, createdAtMs, updatedAtMs, turnCount]
      properties:
        conversationId: {type: string, pattern: '^conv_[a-f0-9]{16,64}$'}
        graphDigest: {$ref: '#/components/schemas/Digest'}
        snapshotDigest: {type: string}
        contextId: {type: string}
        mode: {type: string, enum: [EXPLORE, DESIGN, REPAIR]}
        title: {type: string}
        findingId: {type: [string, 'null']}
        archived: {type: boolean}
        createdAtMs: {type: integer}
        updatedAtMs: {type: integer}
        turnCount: {type: integer, minimum: 0}
    ChatConversationTurn:
      type: object
      additionalProperties: false
      required: [turnId, conversationId, seq, role, content, evidence, toolTrace, citations, promptCacheMetrics, createdAtMs]
      properties:
        turnId: {type: string}
        conversationId: {type: string}
        seq: {type: integer, minimum: 1}
        role: {type: string, enum: [USER, ASSISTANT]}
        content: {type: string}
        evidence: {type: array, items: {}}
        toolTrace: {type: array, items: {}}
        citations: {type: array, items: {}}
        promptCacheMetrics: {type: object}
        inputDigest: {type: [string, 'null']}
        modelId: {type: [string, 'null']}
        createdAtMs: {type: integer}
    BehavioralVerdict:
      type: string
      enum: [EQUIVALENT_ON_BOUNDED_CHECKS, BEHAVIOR_CHANGED, UNKNOWN_UNTESTED]
    SpringPreservationStatus:
      type: string
      enum: [PRESERVED, DRIFT_DETECTED, NOT_APPLICABLE]
    RepairVerificationJobStage:
      type: string
      description: Lifecycle stage of a repair verification job, including atomic restart-recovery stage INTERRUPTED_ON_RESTART (errorCode=INTERRUPTED_ON_RESTART).
      enum: [QUEUED, STAGING, PASSIVE_REANALYSIS, SANDBOX_BUILD, SANDBOX_TEST, DIFF_TESTGEN, CLOSED_LOOP_REPAIR, IMPACT_SCORING, REPORT_READY, FAILED, CANCELLED, INTERRUPTED_ON_RESTART]
    RepairRestartRecoveryErrorCode:
      type: string
      description: Canonical error code recorded on repair_jobs rows and recovery SSE events when a server restarts while a job is in flight.
      enum: [INTERRUPTED_ON_RESTART]
    RepairTrustLabel:
      type: string
      description: Truthful verification trust label. ISOLATED_VM_VERIFIED and ISOLATED_CONTAINER_VERIFIED require verdict == VERIFIED and tests not skipped.
      enum: [ISOLATED_VM_VERIFIED, ISOLATED_CONTAINER_VERIFIED, ISOLATED_VM_REJECTED, ISOLATED_CONTAINER_REJECTED, ISOLATED_VM_UNVERIFIED, ISOLATED_CONTAINER_UNVERIFIED, PASSIVE_REANALYSIS_ONLY, SYNTAX_ONLY]
    PreviewMeta:
      type: object
      additionalProperties: false
      required: [truthTier, completedContexts, totalContexts, pendingModules]
      properties:
        jobId: {type: string, format: uuid}
        truthTier: {$ref: '#/components/schemas/TruthTier'}
        completedContexts: {type: integer, minimum: 0}
        totalContexts: {type: integer, minimum: 0}
        pendingModules: {type: array, items: {type: string}}
        publishedAt: {type: string, format: date-time}
        supersededByGraphId: {$ref: '#/components/schemas/Digest'}
    PreviewPublication:
      type: object
      additionalProperties: false
      required: [graphId, truthTier, completedContexts, totalContexts, pendingModules, publishedAt]
      properties:
        graphId: {$ref: '#/components/schemas/Digest'}
        truthTier: {$ref: '#/components/schemas/TruthTier'}
        completedContexts: {type: integer, minimum: 0}
        totalContexts: {type: integer, minimum: 0}
        pendingModules: {type: array, items: {type: string}}
        publishedAt: {type: string, format: date-time}
    IncrementalMetrics:
      type: object
      additionalProperties: false
      required: [baseSnapshotId, addedFiles, modifiedFiles, deletedFiles, reusedFiles, abiEarlyCutoffCount, impactedDependentsCount, reusedModules, timeSavedEstimateMs]
      properties:
        baseSnapshotId: {type: [string, 'null']}
        addedFiles: {type: integer, minimum: 0}
        modifiedFiles: {type: integer, minimum: 0}
        deletedFiles: {type: integer, minimum: 0}
        reusedFiles: {type: integer, minimum: 0}
        abiEarlyCutoffCount: {type: integer, minimum: 0}
        impactedDependentsCount: {type: integer, minimum: 0}
        reusedModules: {type: integer, minimum: 0}
        timeSavedEstimateMs: {type: integer, minimum: 0}
    ModuleProgress:
      type: object
      additionalProperties: false
      required: [module, status, filesDone, filesTotal, elapsedMillis, contextId, reason]
      properties:
        module: {type: string}
        status: {type: string}
        filesDone: {type: integer, minimum: 0}
        filesTotal: {type: integer, minimum: 0}
        elapsedMillis: {type: integer, minimum: 0}
        contextId: {type: [string, 'null']}
        reason: {type: [string, 'null']}
    LiveProgress:
      type: object
      additionalProperties: false
      required: [jobId, setup, state, stage, revision, truthTier, previewGraphId, preview, overallRatio, stageDone, stageTotal, filesPerSecond, etaSeconds, etaStatus, elapsedMillis, message, modules, stageMillis, cacheMetrics, incremental]
      properties:
        jobId: {type: string, format: uuid}
        setup: {$ref: '#/components/schemas/JobIdentifier'}
        state: {type: string, enum: [QUEUED, RUNNING, CANCELLING, SUCCEEDED, PARTIAL, EMPTY, FAILED, CANCELLED, TIMED_OUT]}
        stage: {$ref: '#/components/schemas/JobStage'}
        revision: {type: integer, minimum: 1}
        truthTier: {$ref: '#/components/schemas/TruthTier'}
        previewGraphId: {anyOf: [{$ref: '#/components/schemas/Digest'}, {type: 'null'}]}
        preview: {anyOf: [{$ref: '#/components/schemas/PreviewPublication'}, {type: 'null'}]}
        overallRatio: {type: number, minimum: 0, maximum: 1}
        stageDone: {type: integer, minimum: 0}
        stageTotal: {type: integer, minimum: 0}
        filesPerSecond: {type: [number, 'null']}
        etaSeconds: {type: [integer, 'null']}
        etaStatus: {type: string}
        elapsedMillis: {type: integer, minimum: 0}
        message: {type: string}
        modules: {type: array, items: {$ref: '#/components/schemas/ModuleProgress'}}
        stageMillis: {type: object, additionalProperties: {type: integer, minimum: 0}}
        cacheMetrics: {type: object, additionalProperties: {type: integer, minimum: 0}}
        incremental: {anyOf: [{$ref: '#/components/schemas/IncrementalMetrics'}, {type: 'null'}]}
    AnalysisResult:
      type: object
      additionalProperties: false
      required: [completion, graph, snapshot, analyses, contexts, reports, gapCount, graphGapCount, jobGapCount, inputProblemCount, acquisition, sourceReport]
      properties:
        completion: {type: string, enum: [COMPLETE, PARTIAL, EMPTY, FAILED]}
        graph: {anyOf: [{$ref: '#/components/schemas/Digest'}, {type: 'null'}]}
        snapshot: {type: [string, 'null']}
        analyses: {type: array, uniqueItems: true, items: {type: string}}
        contexts: {type: array, uniqueItems: true, items: {type: string}}
        reports: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/Digest'}}
        gapCount: {type: integer, minimum: 0}
        graphGapCount: {type: integer, minimum: 0}
        jobGapCount: {type: integer, minimum: 0}
        inputProblemCount: {type: integer, minimum: 0}
        acquisition: {anyOf: [{$ref: '#/components/schemas/Digest'}, {type: 'null'}]}
        sourceReport: {anyOf: [{$ref: '#/components/schemas/Digest'}, {type: 'null'}]}
    Digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    Version:
      type: object
      required: [id, version]
      properties:
        id: {const: architecture.query}
        version: {const: m8.3-v1}
    Envelope:
      type: object
      required: [apiVersion, queryVersion, resultIdentity, data]
      additionalProperties: false
      properties:
        apiVersion: {const: 'architecture.http:m7.1-v1'}
        queryVersion: {$ref: '#/components/schemas/Version'}
        jobVersion: {const: 'architecture.jobs:m8.1-v1'}
        resultIdentity: {$ref: '#/components/schemas/Digest'}
        data: {}
    StringSet:
      type: array
      uniqueItems: true
      items: {type: string, minLength: 1, maxLength: 8192, pattern: '\S'}
    Population:
      type: object
      additionalProperties: false
      properties:
        nodeKinds: {$ref: '#/components/schemas/StringSet'}
        modules: {$ref: '#/components/schemas/StringSet'}
        origins: {$ref: '#/components/schemas/StringSet'}
        sourceSets: {$ref: '#/components/schemas/StringSet'}
    Realization:
      type: object
      additionalProperties: false
      properties:
        world: {type: [string, 'null'], minLength: 1, maxLength: 8192, pattern: '\S'}
        assignment:
          type: object
          propertyNames: {minLength: 1, maxLength: 256, pattern: '\S'}
          additionalProperties: {type: boolean}
      oneOf:
        - required: [world]
          properties:
            world: {type: string}
            assignment: {maxProperties: 0}
        - required: [assignment]
          properties:
            world: {type: 'null'}
            assignment: {minProperties: 1}
    Limits:
      type: object
      additionalProperties: false
      properties:
        maxDepth: {type: integer, minimum: 1, maximum: 20, default: 20}
        maxSteps: {type: integer, minimum: 1, maximum: 100000, default: 100000}
        maxResults: {type: integer, minimum: 1, maximum: 50, default: 50}
        maxVertices: {type: integer, minimum: 1, maximum: 100000, default: 100000}
        maxEdges: {type: integer, minimum: 1, maximum: 500000, default: 500000}
        maxSolverSteps: {type: integer, minimum: 1, maximum: 10000000, default: 1000000}
        maxFormulaNodes: {type: integer, minimum: 1, maximum: 100000, default: 100000}
        maxAuxiliaryStates: {type: integer, minimum: 1, maximum: 500000, default: 200000}
    Request:
      type: object
      required: [context, scope, projection, direction, relationshipKinds]
      additionalProperties: false
      properties:
        graph: {$ref: '#/components/schemas/Digest'}
        context: {type: string, minLength: 1, maxLength: 8192, pattern: '\S'}
        scope: {enum: [ENTITY, TYPE, PACKAGE, MODULE, SPRING_COMPONENT]}
        projection: {enum: [REALIZED, MUST, MAY, BOUNDED_UNION, UNKNOWN_OVERLAY]}
        direction: {enum: [OUTGOING, INCOMING]}
        relationshipKinds:
          allOf:
            - {$ref: '#/components/schemas/StringSet'}
            - {minItems: 1}
        population: {$ref: '#/components/schemas/Population'}
        includeMust: {type: boolean, default: false}
        realization:
          anyOf:
            - {$ref: '#/components/schemas/Realization'}
            - {type: 'null'}
        limits: {$ref: '#/components/schemas/Limits'}
      allOf:
        - if:
            properties:
              projection: {const: REALIZED}
          then:
            required: [realization]
            properties:
              realization: {$ref: '#/components/schemas/Realization'}
          else:
            properties:
              realization: {type: 'null'}
    Page:
      type: object
      additionalProperties: false
      properties:
        size: {type: integer, minimum: 1, maximum: 50, default: 50}
        cursor: {type: [string, 'null'], minLength: 1, maxLength: 8192, pattern: '\S'}
    QueryCall:
      type: object
      required: [request]
      additionalProperties: false
      properties:
        request: {$ref: '#/components/schemas/Request'}
        arguments: {type: object}
        page: {$ref: '#/components/schemas/Page'}
    QueryResult:
      type: object
      required: [query, status, operation, items, evidence, gaps, bounds, continuation, exactTotal]
      properties:
        query: {$ref: '#/components/schemas/Digest'}
        status: {enum: [COMPLETE, PARTIAL, WITHHELD, NOT_APPLICABLE]}
        operation: {enum: [COMPLETED, CANCELLED, RESOURCE_LIMIT]}
        items: {type: array, maxItems: 50, items: {}}
        evidence: {type: array, items: {$ref: '#/components/schemas/Digest'}}
        gaps: {type: array, description: 'Original typed CapabilityGapRecord values and identities.', items: {type: object}}
        bounds: {type: object, description: 'Original canonical Bounds: stop reason, counters, frontier and separate work/output flags.'}
        continuation: {type: [string, 'null']}
        exactTotal: {type: [integer, 'null'], minimum: 0}
