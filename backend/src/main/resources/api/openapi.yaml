  /api/v1/graphs/{graph}/repo-map:
    parameters:
      - {$ref: '#/components/parameters/Graph'}
    get:
      operationId: repoMapDefault
      description: Compute a deterministic Personalized PageRank (PPR) repository map over the canonical graph with default bounds.
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: repoMap
      description: Compute a deterministic Personalized PageRank (PPR) or Hybrid PPR + BM25 + Trigram RRF (ppr-bm25-trigram-rrf-v2) repository map optionally seeded by symbols, query terms, or file paths within a token budget. Each ranked file carries optional additive pprRank, bm25Rank, trigramRank, and rrfScore breakdown fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                context: {type: string, minLength: 1, maxLength: 8192}
                seeds:
                  type: array
                  maxItems: 50
                  items: {type: string, minLength: 1, maxLength: 512}
                maxFiles: {type: integer, minimum: 1, maximum: 100, default: 25}
                maxTokens: {type: integer, minimum: 500, maximum: 24000, default: 4000}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
