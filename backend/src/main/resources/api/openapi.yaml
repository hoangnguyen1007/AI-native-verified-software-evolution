openapi: 3.1.0
info:
  title: Architecture Workbench API
  version: m8.1-v1
  description: Local cancellable analysis jobs and unchanged canonical query/report adapters. Job routes require operator-registered setups.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/v1:
    get:
      operationId: capabilities
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/graphs/{graph}:
    parameters:
      - {$ref: '#/components/parameters/Graph'}
    get:
      operationId: graphContextsAndReports
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/graphs/{graph}/queries/{operation}:
    parameters:
      - {$ref: '#/components/parameters/Graph'}
      - in: path
        name: operation
        required: true
        schema:
          type: string
          enum: [summary, provenance, entities, entity, edges, dependencies, relationships, expand, paths, shortest-path, cycles, reachability, impact, evidence, explain, gaps, spring, configurations, artifacts, metric-catalog, metric, comparison-preparation, visual-graph]
    post:
      operationId: query
      description: Read-only POST supports structured filters. Arguments are operation-specific; see the M7.1 architecture contract. Domain PARTIAL/CANCELLED results use HTTP 200 and retain their gaps and bounds.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueryCall'}
      responses:
        '200': {$ref: '#/components/responses/QuerySuccess'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/graphs/{graph}/reports/{report}:
    parameters:
      - {$ref: '#/components/parameters/Graph'}
      - {$ref: '#/components/parameters/Report'}
    get:
      operationId: publishedReportSummary
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/graphs/{graph}/reports/{report}/{operation}:
    parameters:
      - {$ref: '#/components/parameters/Graph'}
      - {$ref: '#/components/parameters/Report'}
      - in: path
        name: operation
        required: true
        schema:
          type: string
          enum: [rules, findings, finding, bundle, policy-metrics, assessment, policy-impact, visual-graph]
    post:
      operationId: publishedReportArtifact
      description: Returns supplied immutable canonical results. Missing reports/artifacts are 404; no policy execution or score recomputation occurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                arguments: {type: object, description: 'finding/bundle require identity; other operations require an empty object.'}
                page: {$ref: '#/components/schemas/Page'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/analysis/setups:
    get:
      operationId: analysisSetups
      responses:
        '200': {$ref: '#/components/responses/JobSuccess'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/analysis/jobs:
    get:
      operationId: firstJobHistoryPage
      description: First 20 jobs in submission order. Use POST history for explicit pagination. Membership freezes at the first page; state remains live.
      responses:
        '200': {$ref: '#/components/responses/JobHistory'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: submitAnalysis
      description: Select a registered setup. The required idempotency key prevents duplicate work after transport interruption. A job is independent of its submitting HTTP connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [setup, idempotencyKey]
              properties:
                setup: {$ref: '#/components/schemas/JobIdentifier'}
                idempotencyKey: {$ref: '#/components/schemas/JobIdentifier'}
      responses:
        '202': {$ref: '#/components/responses/JobDetail'}
        '200': {$ref: '#/components/responses/JobDetail'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/analysis/jobs/history:
    post:
      operationId: jobHistory
      requestBody: {$ref: '#/components/requestBodies/JobPage'}
      responses:
        '200': {$ref: '#/components/responses/JobHistory'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/analysis/jobs/{job}:
    parameters: [{$ref: '#/components/parameters/Job'}]
    get:
      operationId: analysisJob
      responses:
        '200': {$ref: '#/components/responses/JobDetail'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/analysis/jobs/{job}/cancel:
    parameters: [{$ref: '#/components/parameters/Job'}]
    post:
      operationId: cancelAnalysis
      description: Idempotent cancellation. Running work remains CANCELLING until the worker acknowledges termination. Terminal results do not change.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '202': {$ref: '#/components/responses/JobDetail'}
        '200': {$ref: '#/components/responses/JobDetail'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/analysis/jobs/{job}/gaps:
    parameters: [{$ref: '#/components/parameters/Job'}]
    post:
      operationId: analysisJobGaps
      description: Supplemental typed job/policy gaps after completion. Canonical graph gaps remain available through graph/context queries. Receipt gapCount is the unique union, not the sum of these overlapping populations.
      requestBody: {$ref: '#/components/requestBodies/JobPage'}
      responses:
        '200': {$ref: '#/components/responses/JobSuccess'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/analysis/jobs/{job}/input-diagnostics:
    parameters: [{$ref: '#/components/parameters/Job'}]
    post:
      operationId: analysisInputDiagnostics
      description: Original typed acquisition problems with provider and acquisition SHA-256 references, including failures before a snapshot exists. No synthetic snapshot or analysis identity is invented.
      requestBody: {$ref: '#/components/requestBodies/JobPage'}
      responses:
        '200': {$ref: '#/components/responses/JobSuccess'}
        default: {$ref: '#/components/responses/Error'}
components:
  requestBodies:
    JobPage:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Page'}
  parameters:
    Job:
      in: path
      name: job
      required: true
      schema: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
    Graph:
      in: path
      name: graph
      required: true
      schema: {$ref: '#/components/schemas/Digest'}
    Report:
      in: path
      name: report
      required: true
      schema: {$ref: '#/components/schemas/Digest'}
  responses:
    JobSuccess:
      description: Bounded job data. Operational UUIDs, revisions and times never enter canonical analysis identities. History and job state are process-local; graph snapshots persist in the configured store.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - required: [jobVersion]
    JobDetail:
      description: Current job state and published canonical artifact identities, when available.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - required: [jobVersion]
                properties:
                  data: {$ref: '#/components/schemas/AnalysisJob'}
    JobHistory:
      description: Bounded history with stable membership and explicit total/continuation; item states remain live.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - required: [jobVersion]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [items, total, continuation]
                    properties:
                      items: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/AnalysisJob'}}
                      total: {type: integer, minimum: 0, maximum: 256}
                      continuation: {type: [string, 'null'], maxLength: 512}
    Success:
      description: Canonical data with SHA-256 of its canonical UTF-8 JSON. Cache-Control is no-store.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
    QuerySuccess:
      description: Canonical query result, including honest partial/withheld/cancellation states.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - properties:
                  data: {$ref: '#/components/schemas/QueryResult'}
    Error:
      description: '400 invalid request; 403 origin; 404 absent route/graph/report/artifact/setup/job; 405 method; 406 Accept; 409 retry conflict/unfinished job/request cancelled; 413 input limit; 415 media/encoding; 422 response limit; 500 internal; 503 storage/busy/job queue/history full/closed/unconfigured. Transport interruption may close the connection before a response is possible.'
      content:
        application/json:
          schema:
            type: object
            required: [apiVersion, queryVersion, error]
            additionalProperties: false
            properties:
              apiVersion: {const: 'architecture.http:m7.1-v1'}
              queryVersion: {$ref: '#/components/schemas/Version'}
              jobVersion: {const: 'architecture.jobs:m8.1-v1'}
              error:
                type: object
                required: [code, message]
                additionalProperties: false
                properties:
                  code: {type: string}
                  message: {type: string}
  schemas:
    JobIdentifier: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$', maxLength: 64}
    JobStage: {type: string, enum: [QUEUED, ACQUISITION, PLATFORM, ANALYSIS, GRAPH, POLICY, PUBLICATION, FINISHED]}
    AnalysisJob:
      type: object
      additionalProperties: false
      required: [id, setup, state, stage, revision, submittedAt, startedAt, finishedAt, elapsedMillis, stop, error, events, result]
      properties:
        id: {type: string, format: uuid}
        setup: {$ref: '#/components/schemas/JobIdentifier'}
        state: {type: string, enum: [QUEUED, RUNNING, CANCELLING, SUCCEEDED, PARTIAL, EMPTY, FAILED, CANCELLED, TIMED_OUT]}
        stage: {$ref: '#/components/schemas/JobStage'}
        revision: {type: integer, minimum: 1}
        submittedAt: {type: string, format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        elapsedMillis: {type: integer, minimum: 0}
        stop: {type: [string, 'null'], enum: [USER_CANCELLED, DEADLINE_EXCEEDED, SERVICE_CLOSED, PROVIDER_INTERRUPTED, null]}
        error: {type: [string, 'null'], enum: [ANALYSIS_FAILED, RESULT_STORAGE_FAILED, RESULT_PUBLICATION_FAILED, null]}
        events:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [stage, at]
            properties:
              stage: {$ref: '#/components/schemas/JobStage'}
              at: {type: string, format: date-time}
        result:
          anyOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/AnalysisResult'}
    AnalysisResult:
      type: object
      additionalProperties: false
      required: [completion, graph, snapshot, analyses, contexts, reports, gapCount, graphGapCount, jobGapCount, inputProblemCount, acquisition, sourceReport]
      properties:
        completion: {type: string, enum: [COMPLETE, PARTIAL, EMPTY, FAILED]}
        graph: {anyOf: [{$ref: '#/components/schemas/Digest'}, {type: 'null'}]}
        snapshot: {type: [string, 'null']}
        analyses: {type: array, uniqueItems: true, items: {type: string}}
        contexts: {type: array, uniqueItems: true, items: {type: string}}
        reports: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/Digest'}}
        gapCount: {type: integer, minimum: 0}
        graphGapCount: {type: integer, minimum: 0}
        jobGapCount: {type: integer, minimum: 0}
        inputProblemCount: {type: integer, minimum: 0}
        acquisition: {anyOf: [{$ref: '#/components/schemas/Digest'}, {type: 'null'}]}
        sourceReport: {anyOf: [{$ref: '#/components/schemas/Digest'}, {type: 'null'}]}
    Digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    Version:
      type: object
      required: [id, version]
      properties:
        id: {const: architecture.query}
        version: {const: m7.2-v2}
    Envelope:
      type: object
      required: [apiVersion, queryVersion, resultIdentity, data]
      additionalProperties: false
      properties:
        apiVersion: {const: 'architecture.http:m7.1-v1'}
        queryVersion: {$ref: '#/components/schemas/Version'}
        jobVersion: {const: 'architecture.jobs:m8.1-v1'}
        resultIdentity: {$ref: '#/components/schemas/Digest'}
        data: {}
    StringSet:
      type: array
      uniqueItems: true
      items: {type: string, minLength: 1, maxLength: 8192, pattern: '\S'}
    Population:
      type: object
      additionalProperties: false
      properties:
        nodeKinds: {$ref: '#/components/schemas/StringSet'}
        modules: {$ref: '#/components/schemas/StringSet'}
        origins: {$ref: '#/components/schemas/StringSet'}
        sourceSets: {$ref: '#/components/schemas/StringSet'}
    Realization:
      type: object
      additionalProperties: false
      properties:
        world: {type: [string, 'null'], minLength: 1, maxLength: 8192, pattern: '\S'}
        assignment:
          type: object
          propertyNames: {minLength: 1, maxLength: 256, pattern: '\S'}
          additionalProperties: {type: boolean}
      oneOf:
        - required: [world]
          properties:
            world: {type: string}
            assignment: {maxProperties: 0}
        - required: [assignment]
          properties:
            world: {type: 'null'}
            assignment: {minProperties: 1}
    Limits:
      type: object
      additionalProperties: false
      properties:
        maxDepth: {type: integer, minimum: 1, maximum: 20, default: 20}
        maxSteps: {type: integer, minimum: 1, maximum: 100000, default: 100000}
        maxResults: {type: integer, minimum: 1, maximum: 50, default: 50}
        maxVertices: {type: integer, minimum: 1, maximum: 100000, default: 100000}
        maxEdges: {type: integer, minimum: 1, maximum: 500000, default: 500000}
        maxSolverSteps: {type: integer, minimum: 1, maximum: 10000000, default: 1000000}
        maxFormulaNodes: {type: integer, minimum: 1, maximum: 100000, default: 100000}
        maxAuxiliaryStates: {type: integer, minimum: 1, maximum: 500000, default: 200000}
    Request:
      type: object
      required: [context, scope, projection, direction, relationshipKinds]
      additionalProperties: false
      properties:
        graph: {$ref: '#/components/schemas/Digest'}
        context: {type: string, minLength: 1, maxLength: 8192, pattern: '\S'}
        scope: {enum: [ENTITY, TYPE, PACKAGE, MODULE, SPRING_COMPONENT]}
        projection: {enum: [REALIZED, MUST, MAY, BOUNDED_UNION, UNKNOWN_OVERLAY]}
        direction: {enum: [OUTGOING, INCOMING]}
        relationshipKinds:
          allOf:
            - {$ref: '#/components/schemas/StringSet'}
            - {minItems: 1}
        population: {$ref: '#/components/schemas/Population'}
        includeMust: {type: boolean, default: false}
        realization:
          anyOf:
            - {$ref: '#/components/schemas/Realization'}
            - {type: 'null'}
        limits: {$ref: '#/components/schemas/Limits'}
      allOf:
        - if:
            properties:
              projection: {const: REALIZED}
          then:
            required: [realization]
            properties:
              realization: {$ref: '#/components/schemas/Realization'}
          else:
            properties:
              realization: {type: 'null'}
    Page:
      type: object
      additionalProperties: false
      properties:
        size: {type: integer, minimum: 1, maximum: 50, default: 50}
        cursor: {type: [string, 'null'], minLength: 1, maxLength: 8192, pattern: '\S'}
    QueryCall:
      type: object
      required: [request]
      additionalProperties: false
      properties:
        request: {$ref: '#/components/schemas/Request'}
        arguments: {type: object}
        page: {$ref: '#/components/schemas/Page'}
    QueryResult:
      type: object
      required: [query, status, operation, items, evidence, gaps, bounds, continuation, exactTotal]
      properties:
        query: {$ref: '#/components/schemas/Digest'}
        status: {enum: [COMPLETE, PARTIAL, WITHHELD, NOT_APPLICABLE]}
        operation: {enum: [COMPLETED, CANCELLED, RESOURCE_LIMIT]}
        items: {type: array, maxItems: 50, items: {}}
        evidence: {type: array, items: {$ref: '#/components/schemas/Digest'}}
        gaps: {type: array, description: 'Original typed CapabilityGapRecord values and identities.', items: {type: object}}
        bounds: {type: object, description: 'Original canonical Bounds: stop reason, counters, frontier and separate work/output flags.'}
        continuation: {type: [string, 'null']}
        exactTotal: {type: [integer, 'null'], minimum: 0}
