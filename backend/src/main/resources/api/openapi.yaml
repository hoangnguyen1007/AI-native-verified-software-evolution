openapi: 3.1.0
info:
  title: Architecture Workbench API
  version: m8.4-polyglot-v1
  description: Local cancellable analysis, optional loopback repository connections and canonical query/report adapters. Connections and producer semantic publication queries require explicit operator composition.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/v1/evolution/jobs:
    post:
      operationId: submitEvolution
      description: Compare registered immutable inputs. An explicit idempotency key retries the original receipt. An unkeyed submission re-evaluates input availability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request]
              additionalProperties: false
              properties:
                request: {$ref: '#/components/schemas/EvolutionRequest'}
                idempotencyKey: {type: string, pattern: '^[A-Za-z0-9_-]{1,96}$'}
      responses:
        '200': {$ref: '#/components/responses/EvolutionSuccess'}
        '202': {$ref: '#/components/responses/EvolutionSuccess'}
        default: {$ref: '#/components/responses/EvolutionError'}
  /api/v1/evolution/jobs/{job}:
    parameters:
      - {name: job, in: path, required: true, schema: {$ref: '#/components/schemas/Digest'}}
    get:
      operationId: evolutionJob
      responses:
        '200': {$ref: '#/components/responses/EvolutionSuccess'}
        default: {$ref: '#/components/responses/EvolutionError'}
  /api/v1/evolution/jobs/{job}/cancel:
    parameters:
      - {name: job, in: path, required: true, schema: {$ref: '#/components/schemas/Digest'}}
    post:
      operationId: cancelEvolution
      requestBody: {$ref: '#/components/requestBodies/EvolutionEmpty'}
      responses:
        '200': {$ref: '#/components/responses/EvolutionSuccess'}
        default: {$ref: '#/components/responses/EvolutionError'}
  /api/v1/evolution/jobs/{job}/resume:
    parameters:
      - {name: job, in: path, required: true, schema: {$ref: '#/components/schemas/Digest'}}
    post:
      operationId: resumeEvolution
      requestBody: {$ref: '#/components/requestBodies/EvolutionEmpty'}
      responses:
        '200': {$ref: '#/components/responses/EvolutionSuccess'}
        default: {$ref: '#/components/responses/EvolutionError'}
  /api/v1/evolution/results/{result}:
    parameters:
      - {$ref: '#/components/parameters/EvolutionResult'}
    get:
      operationId: evolutionSummary
      description: Open a verified archive root with direction, exact stored row counts, and domain disposition.
      responses:
        '200': {$ref: '#/components/responses/EvolutionSuccess'}
        default: {$ref: '#/components/responses/EvolutionError'}
  /api/v1/evolution/results/{result}/query:
    parameters:
      - {$ref: '#/components/parameters/EvolutionResult'}
    post:
      operationId: evolutionQuery
      requestBody: {$ref: '#/components/requestBodies/EvolutionPage'}
      responses:
        '200': {$ref: '#/components/responses/EvolutionSuccess'}
        default: {$ref: '#/components/responses/EvolutionError'}
  /api/v1/evolution/results/{result}/export:
    parameters:
      - {$ref: '#/components/parameters/EvolutionResult'}
    get:
      operationId: startEvolutionExport
      description: First chunk of the canonical redacted export.
      responses:
        '200': {$ref: '#/components/responses/EvolutionSuccess'}
        default: {$ref: '#/components/responses/EvolutionError'}
    post:
      operationId: evolutionExportPage
      requestBody: {$ref: '#/components/requestBodies/EvolutionPage'}
      responses:
        '200': {$ref: '#/components/responses/EvolutionSuccess'}
        default: {$ref: '#/components/responses/EvolutionError'}
  /api/v1/evolution/results/{result}/graph:
    parameters:
      - {$ref: '#/components/parameters/EvolutionResult'}
    post:
      operationId: evolutionGraph
      description: Read a pinned side and exact context as paged raw nodes or directed edges.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [side, context]
              additionalProperties: false
              properties:
                side: {enum: [LEFT, RIGHT]}
                context: {type: string, maxLength: 512}
                edges: {type: boolean, default: false}
                node: {type: string, description: Exact source node for outgoing expansion when edges is true.}
                size: {type: integer, minimum: 1, maximum: 50, default: 20}
                cursor: {type: string}
      responses:
        '200': {$ref: '#/components/responses/EvolutionSuccess'}
        default: {$ref: '#/components/responses/EvolutionError'}
  /api/v1/evolution/results/{result}/evidence:
    parameters:
      - {$ref: '#/components/parameters/EvolutionResult'}
    post:
      operationId: evolutionEvidence
      description: Resolve an existing evidence reference against the pinned immutable graph of one side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [side, identity]
              additionalProperties: false
              properties:
                side: {enum: [LEFT, RIGHT]}
                identity: {$ref: '#/components/schemas/Digest'}
      responses:
        '200': {$ref: '#/components/responses/EvolutionSuccess'}
        default: {$ref: '#/components/responses/EvolutionError'}
  /api/v1/bridges/catalog:
    post:
      operationId: bridgeCatalog
      description: Bounded saved-analysis navigation labels from immutable metadata. SAVED_UNVERIFIED is not a semantic validation result; selecting a scope still performs full replay and live policy checks. Unreadable publications remain explicit entries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                after: {$ref: '#/components/schemas/Digest'}
                size: {type: integer, minimum: 1, maximum: 20, default: 5}
      responses:
        '200': {$ref: '#/components/responses/BridgeSuccess'}
        default: {$ref: '#/components/responses/BridgeError'}
  /api/v1/bridges/summary:
    post:
      operationId: bridgeSummary
      description: Whole captured selection accounting, separate semantic/audit identities and withheld assessment. The operator supplies the store and live read policy.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BridgeScopeQuery'}
      responses:
        '200': {$ref: '#/components/responses/BridgeSuccess'}
        default: {$ref: '#/components/responses/BridgeError'}
  /api/v1/bridges/page:
    post:
      operationId: bridgePage
      description: Bounded scan over partitions, endpoints, requirements, relations or typed gaps; native FACTS, NATIVE_GAPS and ARTIFACTS require an exact partition. Native tables retain original source/context/status and F01–F12/A01–A12 categories. Empty filtered pages can have continuation. Root gaps also apply to filtered views; paging never shrinks global accounting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/BridgeScopeFields'}
                - type: object
                  required: [section]
                  properties:
                    section: {type: string, enum: [PARTITIONS, ENDPOINTS, REQUIREMENTS, RELATIONS, GAPS, FACTS, NATIVE_GAPS, ARTIFACTS, DOCUMENTS]}
                    category: {type: string, pattern: '^(B0[1-8]|[AF](0[1-9]|1[0-2]))$', description: 'B01–B08 for bridge views; F01–F12 or A01–A12 for native facts/obligations; absent for artifacts.'}
                    partition: {type: string}
                    symbol: {$ref: '#/components/schemas/Digest'}
                    document: {type: string, description: 'Exact captured logical source path; accepted for native views and ENDPOINTS.'}
                    search: {type: string, minLength: 1, maxLength: 256, description: 'Case-insensitive captured names and paths. Search/source-filter pages scan at most 500 rows and return at most size matches; continuation preserves remaining work. Global accounting is unchanged.'}
                    size: {type: integer, minimum: 1, maximum: 50, default: 20}
                    cursor: {$ref: '#/components/schemas/BridgeCursor'}
              unevaluatedProperties: false
              if:
                properties: {section: {enum: [FACTS, NATIVE_GAPS, ARTIFACTS, DOCUMENTS]}}
                required: [section]
              then:
                required: [partition]
                properties:
                  category: {type: string, pattern: '^[AF](0[1-9]|1[0-2])$'}
                if: {properties: {section: {enum: [ARTIFACTS, DOCUMENTS]}}}
                then: {not: {required: [category]}}
              else:
                properties:
                  category: {type: string, pattern: '^B0[1-8]$'}
                if: {required: [document]}
                then: {properties: {section: {const: ENDPOINTS}}}
      responses:
        '200': {$ref: '#/components/responses/BridgeSuccess'}
        default: {$ref: '#/components/responses/BridgeError'}
  /api/v1/bridges/impact:
    post:
      operationId: bridgePotentialImpact
      description: Bounded incoming structural/contract paths with independent hop qualifications and an explicit unknown/resource frontier. This does not prove runtime breakage or jointly feasible execution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/BridgeScopeFields'}
                - type: object
                  required: [target]
                  properties:
                    target: {$ref: '#/components/schemas/Digest'}
                    depth: {type: integer, minimum: 1, maximum: 20, default: 3}
                    nodes: {type: integer, minimum: 1, maximum: 50, default: 20}
                    scanBudget: {type: integer, minimum: 1, maximum: 1000, default: 1000}
              unevaluatedProperties: false
      responses:
        '200': {$ref: '#/components/responses/BridgeSuccess'}
        default: {$ref: '#/components/responses/BridgeError'}
  /api/v1/bridges/topology:
    post:
      operationId: bridgeBoundedTopology
      description: Bounded incoming paths, cross-context boundaries and observed cycles with joint captured feature checks. The traversal is not exhaustive; incompatible selections and unknown regions are explicit, with no runtime-cycle or policy-violation assertion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/BridgeScopeFields'}
                - type: object
                  required: [target]
                  properties:
                    target: {$ref: '#/components/schemas/Digest'}
                    depth: {type: integer, minimum: 1, maximum: 20, default: 3}
                    nodes: {type: integer, minimum: 1, maximum: 50, default: 20}
                    scanBudget: {type: integer, minimum: 1, maximum: 1000, default: 1000}
              unevaluatedProperties: false
      responses:
        '200': {$ref: '#/components/responses/BridgeSuccess'}
        default: {$ref: '#/components/responses/BridgeError'}
  /api/v1/semantic/root-gaps:
    post:
      operationId: semanticRootGaps
      description: Paged source/context census gaps. Publication does not establish semantic authority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{$ref: '#/components/schemas/SemanticPageQuery'}]
              unevaluatedProperties: false
      responses:
        '200': {$ref: '#/components/responses/SemanticSuccess'}
        default: {$ref: '#/components/responses/SemanticError'}
  /api/v1/semantic/answers:
    post:
      operationId: semanticAnswerPage
      description: Read the published question view, immutable same-input revisions or deterministic conflict witnesses. These are captured producer projections. Live opaque proofs are recomputed by analysis/resume; reading saved state does not restore semantic authority or close root coverage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/SemanticPageQuery'}
                - type: object
                  required: [context]
                  properties:
                    context: {type: string, minLength: 1, maxLength: 8192}
                    view: {type: string, enum: [CURRENT, HISTORY, CONFLICTS], default: CURRENT}
              unevaluatedProperties: false
      responses:
        '200': {$ref: '#/components/responses/SemanticSuccess'}
        default: {$ref: '#/components/responses/SemanticError'}
  /api/v1/semantic/summary:
    post:
      operationId: semanticRootSummary
      description: Operator-enabled read-only producer publication. Rechecks selected contexts, referenced bytes and current policy. Completeness remains withheld; this endpoint never starts native analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan]
              properties:
                plan: {$ref: '#/components/schemas/Digest'}
      responses:
        '200': {$ref: '#/components/responses/SemanticSuccess'}
        default: {$ref: '#/components/responses/SemanticError'}
  /api/v1/semantic/contexts:
    post:
      operationId: semanticContextPage
      description: Read selected contexts including missing and failed providers. Cursor binds the immutable publication and table; counts are decimal strings. Changed publications invalidate continuations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{$ref: '#/components/schemas/SemanticPageQuery'}]
              unevaluatedProperties: false
      responses:
        '200': {$ref: '#/components/responses/SemanticSuccess'}
        default: {$ref: '#/components/responses/SemanticError'}
  /api/v1/semantic/gaps:
    post:
      operationId: semanticContextGapPage
      description: Read typed current gaps of one selected context. This is the current producer receipt, not adjudicated conflict history or a semantic-method certificate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/SemanticPageQuery'}
                - type: object
                  required: [context]
                  properties:
                    context: {type: string, minLength: 1, maxLength: 8192}
              unevaluatedProperties: false
      responses:
        '200': {$ref: '#/components/responses/SemanticSuccess'}
        default: {$ref: '#/components/responses/SemanticError'}
  /api/v2/acquisitions/{revision}/overview:
    parameters:
      - in: path
        name: revision
        required: true
        schema: {type: string, pattern: '^[A-Za-z0-9._-]{1,256}$'}
    post:
      operationId: publishedReadinessOverview
      description: Read candidate roots and modules from an already published passive plan. Semantic coverage is not evaluated. The totals include rows beyond the bounded preview; the readiness route exposes the full paged plan. This route never starts discovery.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/acquisitions/{revision}/readiness:
    parameters:
      - in: path
        name: revision
        required: true
        schema: {type: string, pattern: '^[A-Za-z0-9._-]{1,256}$'}
    post:
      operationId: readinessPlanPage
      description: Plan passively from sealed captured inventory, persist by exact content and policy, and read a bounded plan section. Native build/model validation remains pending until protected isolated evidence is supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                section: {type: string, enum: [roots, modules, contexts, requirements, recipes, compilation-groups, selection, unknown], default: requirements}
                size: {type: integer, minimum: 1, maximum: 200, default: 50}
                cursor: {type: string}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/acquisitions/{revision}:
    parameters:
      - in: path
        name: revision
        required: true
        schema: {type: string, pattern: '^[A-Za-z0-9._-]{1,256}$'}
    post:
      operationId: capturedInventoryPage
      description: Read a bounded raw-name inventory page and optional sealed manifest. Acquisition and semantic coverage are separate; no snapshot is invented for an open frontier.
      requestBody: {$ref: '#/components/requestBodies/JobPage'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/acquisitions/history:
    post:
      operationId: acquisitionJournalPage
      description: Live disk-backed acquisition and evidence-revision journal. Counts and sequence offsets use 64-bit integers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                after: {type: integer, format: int64, minimum: 0, default: 0}
                size: {type: integer, minimum: 1, maximum: 1000, default: 20}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/analysis/jobs/{job}/resume:
    parameters: [{$ref: '#/components/parameters/Job'}]
    post:
      operationId: resumeAnalysis
      description: Explicitly resume an interrupted or failed accepted job with its original identity and acquisition checkpoint. Ordinary idempotent submissions retain their original meaning. Published successful jobs are immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, maxProperties: 0}
      responses:
        '202': {$ref: '#/components/responses/JobDetail'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1:
    get:
      operationId: capabilities
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/graphs/{graph}:
    parameters:
      - {$ref: '#/components/parameters/Graph'}
    get:
      operationId: graphContextsAndReports
      description: Read enriched graph discovery metadata, contexts (with semanticState on progressive previews), reports, authoritative flag, truthTier, and optional previewMeta for active ephemeral previews.
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '410':
          description: Preliminary preview graph was evicted and superseded; error.supersededBy identifies the newer preview or finalized graph when known.
          $ref: '#/components/responses/Error'
        default: {$ref: '#/components/responses/Error'}
  /api/v1/graphs/{graph}/architecture-score:
    parameters:
      - {$ref: '#/components/parameters/Graph'}
    post:
      operationId: architectureScoreV2
      description: >-
        Evaluate Architecture Health Score v2 (architecture.score-formula:v2.0) across seven orthogonal structural,
        framework/polyglot, and policy dimensions with strictly separated independent Analysis Confidence and
        conservative lower bounds. Defaults to Whole Repository (snapshot:...) when context is omitted. Returns
        honest WITHHELD (PRELIMINARY_GRAPH_PENDING) on Stage 1 syntax-only previews and 410 PREVIEW_SUPERSEDED on
        evicted previews.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                context: {type: string, minLength: 1, maxLength: 8192, description: Optional context identity or snapshot identity for Whole Repository scoring.}
                policy: {type: string, minLength: 1, maxLength: 65536, description: Optional custom architecture-policy:v1 YAML to evaluate alongside structural dimensions (mutually exclusive with report).}
                report: {$ref: '#/components/schemas/Digest', description: Optional published policy report SHA-256 digest (mutually exclusive with policy).}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '410': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/graphs/{graph}/repository-score:
    parameters: [{$ref: '#/components/parameters/Graph'}]
    get:
      operationId: repositoryScore
      description: Versioned repository practices rubric, grounded in captured file paths. Partial inventories return bounds and an absent point score.
      responses:
        '200': {description: Repository score, applicable weights, observed paths and evidence identities}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: customGraphRepositoryScore
      description: Computes the rubric with optional exact-path overrides on a published graph.
      requestBody: {$ref: '#/components/requestBodies/RepositoryScorePaths'}
      responses:
        '200': {description: Repository score with the selected overrides}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/graphs/{graph}/policy-assessment:
    parameters: [{$ref: '#/components/parameters/Graph'}]
    post:
      operationId: evaluateSnapshotPolicy
      description: Evaluates the built-in cycle rule or supplied YAML against one published Java or Spring context. Returns a report identity when compilation succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [context]
              properties:
                context: {type: string}
                policy: {type: string}
      responses:
        '200': {description: Resolved policy, assessment and report identity or compiler diagnostics}
        '409':
          description: PRELIMINARY_GRAPH_PENDING when targeting an ephemeral progressive preview graph.
          $ref: '#/components/responses/Error'
        '410':
          description: PREVIEW_SUPERSEDED when targeting an evicted preview graph.
          $ref: '#/components/responses/Error'
        default: {$ref: '#/components/responses/Error'}
  /api/v1/graphs/{graph}/architecture-insights:
    parameters:
      - {$ref: '#/components/parameters/Graph'}
    post:
      operationId: architectureInsights
      description: Structural cycles, single-edge removal suggestions, exact transitive dependent counts within the available projection, coupling, and Markdown export. Suggestions whose removal was modeled in the projection carry simulated=true. Conditional edges in a union do not prove a cycle can occur in one configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request]
              properties:
                request: {$ref: '#/components/schemas/Request'}
                arguments:
                  type: object
                  additionalProperties: false
                  properties:
                    report: {$ref: '#/components/schemas/Digest'}
                    topN: {type: integer, minimum: 1, maximum: 50, default: 15}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/graphs/{graph}/architecture-chat:
    parameters:
      - {$ref: '#/components/parameters/Graph'}
    post:
      operationId: architectureChat
      description: Retrieve architecture evidence for one immutable graph and context. Supported current-project overview questions return a local, cited answer. A configured provider can use the offered metadata, submitted messages and optional captured code from a pinned finding. Requests sent to a remote model require per-turn consent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [context, mode, messages]
              properties:
                context: {type: string, minLength: 1, maxLength: 8192}
                mode: { type: string, enum: [EXPLORE, DESIGN, REPAIR] }
                focus: {type: string, minLength: 1, maxLength: 256}
                finding:
                  type: object
                  additionalProperties: false
                  required: [report, identity, bundle]
                  properties:
                    report: {$ref: '#/components/schemas/Digest'}
                    identity: {$ref: '#/components/schemas/Digest'}
                    bundle: {$ref: '#/components/schemas/Digest'}
                evidenceOnly: {type: boolean, default: false}
                allowRemote: {type: boolean, default: false}
                job: {type: string, description: 'Optional analysis job whose graph and snapshot must match the selected context. Published readiness, completion and the job gap census can enrich the chat evidence.'}
                includeSource:
                  type: boolean
                  default: false
                  description: Add captured source for validated citations on the attached finding when the model is used.
                reviewer: {type: boolean, default: false, description: Request a separate architecture reviewer perspective on the same evidence.}
                agentic: {type: boolean, default: false, description: Enable autonomous multi-step read-only GraphRAG tool investigation over the pinned graph.}
                conversationId: {type: string, pattern: '^conv_[a-f0-9]{16,64}$', description: 'Optional persistent chat thread ID owned by the active user and pinned to this graph. When supplied, user and assistant turns with resolvedCitations and prompt cache metrics are atomically persisted to conversations.db.'}
                messages:
                  type: array
                  minItems: 1
                  maxItems: 15
                  description: Alternating user and assistant messages starting and ending with a user question, with up to seven prior exchanges. User messages are limited to 2400 characters and assistant messages to 32000.
                  items:
                    type: object
                    additionalProperties: false
                    required: [role, content]
                    properties:
                      role: {type: string, enum: [user, assistant]}
                      content: {type: string, minLength: 1, maxLength: 32000}
      responses:
        '200':
          description: Evidence packet, local project overview, model advice or architecture scope redirect. Evidence and model exchanges have content digests.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Envelope'}
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [version, status, pin, evidenceIdentity, citations, evidence, limitations]
                        properties:
                          version: {type: string, const: 'architecture.chat:v1'}
                          status: {type: string, enum: [EVIDENCE_ONLY, ADVICE, UNVERIFIED_ADVICE, NEEDS_EVIDENCE, OUT_OF_SCOPE]}
                          pin:
                            type: object
                            required: [graph, snapshot, context]
                            properties:
                              graph: {$ref: '#/components/schemas/Digest'}
                              snapshot: {type: string}
                              context: {type: string}
                              finding:
                                type: [object, 'null']
                                properties:
                                  report: {$ref: '#/components/schemas/Digest'}
                                  identity: {$ref: '#/components/schemas/Digest'}
                                  bundle: {$ref: '#/components/schemas/Digest'}
                          evidenceIdentity: {$ref: '#/components/schemas/Digest'}
                          answer: {type: [string, 'null']}
                          conversationTitle: {type: [string, 'null'], maxLength: 100}
                          conversationId: {type: [string, 'null']}
                          turnId: {type: [string, 'null']}
                          citations: {type: array, items: {type: string}}
                          resolvedCitations:
                            type: array
                            items: {$ref: '#/components/schemas/ResolvedCitation'}
                          agentTrace:
                            type: array
                            items:
                              type: object
                              required: [step, tool, summary, evidenceIds]
                              properties:
                                step: {type: integer}
                                tool: {type: string}
                                arguments: {type: object}
                                summary: {type: string}
                                evidenceIds: {type: array, items: {type: string}}
                                durationMs: {type: integer}
                          evidence:
                            type: array
                            items:
                              type: object
                              required: [id, kind, label, identity, data]
                              properties:
                                id: {type: string}
                                kind: {type: string, enum: [SUMMARY, STRUCTURE, SYMBOLS, DEPENDENCIES, FINDING, SOURCE]}
                                label: {type: string}
                                identity: {type: string}
