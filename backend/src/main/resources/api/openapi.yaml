                mode: {type: string, enum: [FULL, FAST_ARCHITECTURE], default: FULL, description: Explicit analysis execution profile.}
                ref: {type: string, maxLength: 256, pattern: '^[A-Za-z0-9._/@+-]{1,256}$', description: 'Optional Git branch, tag, commit SHA, or refs/pull/{n}/head ref for remote Git/GitHub connections.'}
      responses:
