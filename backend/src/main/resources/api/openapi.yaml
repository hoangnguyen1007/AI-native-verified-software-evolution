                            type: array
                            items: {$ref: '#/components/schemas/ChatConversationSummary'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createChatConversation
      description: Create a new persistent tenant-scoped chat conversation thread pinned to this graph snapshot in conversations.db. Requires api:write PAT scope or CSRF-validated session cookie.
      requestBody:
