    post:
      operationId: queryDsmMatrix
      description: Compute a deterministic levelized Dependency Structure Matrix (DSM) at MODULE, PACKAGE, or TYPE granularity using iterative O(V+E) Tarjan SCC condensation, reporting levelizationScore, contiguous SCC diagonal blocks, and sparse cells with SemanticTrustTier provenance.
